# AIPCC local stack. Postgres is the default local database — this project never
# requires an external/managed DB to run.
#
#   docker compose up               # everything
#   docker compose up -d postgres   # just the DB, for running the backend on the host

# Explicit project name. Without it Compose infers one from the directory and
# warns, since this path resolves through a symlink.
name: aipcc

services:
  postgres:
    image: postgres:16
    container_name: aipcc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aipcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aipcc}
      POSTGRES_DB: ${POSTGRES_DB:-aipcc}
    ports:
      - "5432:5432"
    volumes:
      # Named volume, so data survives `docker compose down` and any restart.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aipcc} -d ${POSTGRES_DB:-aipcc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: aipcc-backend
    depends_on:
      postgres:
        condition: service_healthy
    # The whole .env is passed in, rather than each variable being restated
    # here. Enumerating them meant every new setting had to be added in two
    # places, and forgetting the second one produced a container silently
    # running on defaults. `environment:` below still wins, so the handful of
    # values that must differ inside the container are pinned.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aipcc}:${POSTGRES_PASSWORD:-aipcc}@postgres:5432/${POSTGRES_DB:-aipcc}
      # Absolute, and matching the volume mounts below. The .env default is a
      # host path and would resolve to a throwaway directory inside the image.
      CHROMA_DIR: /app/chroma_langchain_db
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://localhost:5173
      SHARE_BASE_URL: http://localhost:5173
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    volumes:
      # Persist the vector store and uploads across container rebuilds.
      - chroma_data:/app/chroma_langchain_db
      - uploads_data:/app/uploads
    # Migrations run here — never schema creation from application code.
    #
    # Seeding runs here too, which is a deliberate exception to "never on
    # startup". `seed.py` is idempotent — it prints "already present" and does
    # nothing on every boot after the first — and hard rule #1 is about *schema*
    # creation, which still only ever happens through Alembic. The alternative
    # is a reviewer running `docker compose up`, reaching a login form, and
    # having no credentials: the app would be running and unusable.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed --demo --ingest &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/db || exit 1"]
      interval: 10s
      timeout: 5s
      # Generous: the first boot runs migrations and embeds the sample log
      # before uvicorn binds.
      retries: 30
      start_period: 60s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: aipcc-frontend
    depends_on:
      # Only `service_started`: Vite serves the SPA whether or not the API is
      # up, and the app already distinguishes "loading" from "cannot reach the
      # API". Waiting for a healthy backend would hold the UI back through the
      # first-boot migration and embedding for no benefit.
      backend:
        condition: service_started
    environment:
      # The *browser* resolves this, not the container, so it is a host URL.
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: aipcc-n8n
    environment:
      N8N_PORT: 5678
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: ${TZ:-Asia/Dubai}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  postgres_data:
  chroma_data:
  uploads_data:
  n8n_data:
